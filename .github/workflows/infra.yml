---
name: infra

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "stacks/**"
      - "modules/**"
      - "providers/**"
      - "root.hcl"
      - "scripts/**"
      - ".github/workflows/infra.yml"

env:
  OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

jobs:
  deployment:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v23
      - name: Run
        run: |
          nix develop --command bash -c "
            op --version
            terragrunt --version
            curl -v https://tf.kaipov.com/infra/stacks/tfstate
            ./scripts/run.sh stacks/tfstate plan
            ./scripts/run.sh stacks/sites/kaipov.com plan
          "
