name: Infra Run

on:
  repository_dispatch:
    types:
      - infra_run

jobs:
  infra_run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v23
      - name: Run
        run: |
          nix develop --command bash -c "
            terragrunt --version
            echo ${{ github.event.client_payload }}
          "
